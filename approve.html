<main id="main" class="auth approve">
<section class="auth-main"><div class="auth-card" id="ap">
<h1 id="ap-h">אישור משתמש</h1>
<p id="ap-p">טוען את פרטי ההרשמה…</p>
<div id="ap-who" class="acc-list" hidden></div>
<div class="auth-acts"><button type="button" class="cta solid" id="ap-go" hidden>אישור המשתמש</button></div>
<div id="ap-msg" role="status"></div>
</div></section></main>
<script src="config.js?v=274ec6f7"></script><script src="app.js?v=01aebca3"></script>
<script>
(function(){
  var C=window.URIQ_CONFIG||{}, q=new URLSearchParams(location.search), id=q.get('id'), t=q.get('t');
  var H=document.getElementById('ap-h'), P=document.getElementById('ap-p'), W=document.getElementById('ap-who'), B=document.getElementById('ap-go'), M=document.getElementById('ap-msg');
  function esc(s){ return String(s||'').replace(/[&<>"]/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function msg(k,x){ M.innerHTML='<p class="auth-msg '+k+'">'+x+'</p>'; }
  function call(approve){ return fetch(C.supabaseUrl+'/functions/v1/approve',{method:'POST',headers:{'Content-Type':'application/json',apikey:C.supabaseAnonKey},body:JSON.stringify({id:id,t:t,approve:approve?1:0})}).then(function(r){ return r.json().then(function(j){ if(!r.ok) throw j; return j; }); }); }
  function show(j){
    W.hidden=false; W.innerHTML='<div class="acc-card"><span class="av">'+esc((j.name||j.email||'?').charAt(0))+'</span><span class="acc-t"><b>'+esc(j.name||'(ללא שם)')+'</b><span dir="ltr">'+esc(j.email)+'</span></span></div>';
    if(j.approved){ H.textContent='המשתמש מאושר'; P.textContent='המשתמש יכול להיכנס לאתר ולפתור מקבצים.'; B.hidden=true; }
    else { H.textContent='הרשמה חדשה'; P.textContent='המשתמש הזה נרשם ל־urIQ ומחכה לאישור שלך.'; B.hidden=false; }
  }
  if(!id||!t){ H.textContent='קישור לא תקין'; P.textContent='הקישור לאישור חסר. פתחו אותו מהמייל שוב.'; return; }
  call(false).then(show).catch(function(){ H.textContent='הקישור לא נמצא'; P.textContent='ייתכן שהקישור שגוי או שהמשתמש נמחק.'; });
  B.addEventListener('click',function(){ B.disabled=true; B.textContent='מאשר…';
    call(true).then(function(j){ show(j); msg('ok','אושר. בכניסה הבאה שלו לאתר הוא יוכל לפתור מקבצים.'); })
      .catch(function(){ B.disabled=false; B.textContent='אישור המשתמש'; msg('err','האישור נכשל. נסו שוב בעוד רגע.'); }); });
})();
</script></body></html>
